[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "smartdisk"
version = "0.1.0"
description = "Official Python SDK for SmartDisk — a memory engine for conversations and documents, with grounded retrieval and citations."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "PixiLab" }]
keywords = ["smartdisk", "memory", "rag", "retrieval", "agents", "llm", "knowledge-graph"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries",
    "Typing :: Typed",
]
dependencies = [
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[project.urls]
Homepage = "https://smartdisk.pixilab.ai"
Documentation = "https://smartdisk.pixilab.ai/docs"
Source = "https://github.com/PixiLab-ai/smartdisk-python"
Issues = "https://github.com/PixiLab-ai/smartdisk-python/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/smartdisk"]

[tool.ruff]
line-length = 110
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
